########################################################################################################################
# Specifies the SQL dialect for MySQL databases. This will specify hibernate to generate SQL query specific to MySQL

logging.level.org.example.client.ProductServiceClient=DEBUG



########################################################################################################################
# This property configures which management endpoints are exposed over the web.By setting it to *, you?re enabling all available endpoints.
# Management endpoints provide various metrics and management functionalities, such as health checks, environment info, and more.

management.endpoints.web.exposure.include=*



########################################################################################################################
# This property enables the health endpoint, which allows you to check the health status of your application.
# When this is set to true, the application can expose its health status to external systems, which is useful for monitoring and alerting.

management.endpoints.health.enabled=true



########################################################################################################################
# This property controls whether detailed health information should be shown when accessing the health endpoint.
# By setting it to always, it ensures that detailed information about the application's health checks (like database status, disk space, etc.) is always included in the response.
# This can be useful during development and debugging but may expose sensitive information in production.

management.endpoints.health.show-details=always



########################################################################################################################
# This property enables the circuit breaker health indicator, which checks the status of circuit breakers in your application.
# Circuit breakers help manage and prevent cascading failures in microservices by monitoring service calls.
# When this is enabled, the health endpoint will include information about the state of any circuit breakers, indicating whether they are open, closed, or half-open.

management.health.circuitbreakers.enabled=true



########################################################################################################################
# Circuit Breaker configuration for productServiceClient

########################################################################################################################
# Define order at which circuitbreaker module will be executed among all the resilience4j modules (circuitbreaker, retry, ratelimiter etc).
# Higher the value, higher the priority

resilience4j.circuitbreaker.circuit-breaker-aspect-order=1


########################################################################################################################
# Configures the failure rate threshold in percentage.
# When the failure rate is equal or greater than the threshold the CircuitBreaker transitions to open and starts short-circuiting calls.

resilience4j.circuitbreaker.instances.product-ms.failure-rate-threshold=50



########################################################################################################################
# Configures a threshold in percentage. The CircuitBreaker considers a call as slow when the call duration is greater than slowCallDurationThreshold
# When the percentage of slow calls is equal or greater the threshold, the CircuitBreaker transitions to open and starts short-circuiting calls.

resilience4j.circuitbreaker.instances.product-ms.slow-call-rate-threshold=50



########################################################################################################################
# Configures the duration threshold above which calls are considered as slow and increase the rate of slow calls.

resilience4j.circuitbreaker.instances.product-ms.slow-call-duration-threshold=60000ms



########################################################################################################################
# If the sliding window is COUNT_BASED, the last slidingWindowSize calls are recorded and aggregated.
# If the sliding window is TIME_BASED, the calls of the last slidingWindowSize seconds recorded and aggregated.

resilience4j.circuitbreaker.instances.product-ms.sliding-window-type=COUNT_BASED



########################################################################################################################
# Configures the size of the sliding window which is used to record the outcome of calls when the CircuitBreaker is closed.
# Based on the failed calls in this window will be considered to transition from closed to open state.

resilience4j.circuitbreaker.instances.product-ms.sliding-window-size=5



########################################################################################################################
# The time that the CircuitBreaker should wait before transitioning from open to half-open.

resilience4j.circuitbreaker.instances.product-ms.wait-duration-in-open-state=10000ms



########################################################################################################################
# If set to true it means that the CircuitBreaker will automatically transition from open to half-open state and no call is needed to trigger the transition.
# A thread is created to monitor all the instances of CircuitBreakers to transition them to HALF_OPEN once waitDurationInOpenState passes.
# Whereas, if set to false the transition to HALF_OPEN only happens if a call is made, even after waitDurationInOpenState is passed.
# The advantage here is no thread monitors the state of all CircuitBreakers.

resilience4j.circuitbreaker.instances.product-ms.automatic-transition-from-open-to-half-open-enabled=true



########################################################################################################################
# Configures the minimum number of calls which are required (per sliding window period) before the CircuitBreaker can calculate the error rate or slow call rate.
# For example, if minimumNumberOfCalls is 10, then at least 10 calls must be recorded, before the failure rate can be calculated.
# If only 9 calls have been recorded the CircuitBreaker will not transition to open even if all 9 calls have failed.

resilience4j.circuitbreaker.instances.product-ms.minimum-number-of-calls=5



########################################################################################################################
# Retry configuration for productServiceClient

########################################################################################################################
# Define order at which retry module will be executed among all the resilience4j modules (circuitbreaker, retry, ratelimiter etc).
# Higher the value, higher the priority

resilience4j.retry.retry-aspect-order=2



########################################################################################################################
#

resilience4j.retry.instances.product-ms.max-attempts=3
resilience4j.retry.instances.product-ms.wait-duration=2s
resilience4j.retry.instances.product-ms.enable-exponential-backoff=true
resilience4j.retry.instances.product-ms.exponential-backoff-multiplier=5